<!doctype html>
<html lang="cs">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Návrh zahrady</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout: one column. A framed 3D stage on top, layer toggles and a spec list below. */
:root{
  --bg:#f4f3ee; --fg:#22281f; --muted:#67705f; --accent:#4d6b3a;
  --panel:#ffffff; --line:#d8d6cb; --on:#ffffff;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#161a14; --fg:#e6e9de; --muted:#9aa390; --accent:#9bc27f;
    --panel:#1e241b; --line:#323b2d; --on:#161a14; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#161a14; --fg:#e6e9de; --muted:#9aa390; --accent:#9bc27f;
  --panel:#1e241b; --line:#323b2d; --on:#161a14; color-scheme: dark;
}
body{background:var(--bg);color:var(--fg);font-family:Figtree,system-ui,sans-serif;margin:0}
.wrap{max-width:960px;margin:0 auto;padding:20px 16px 32px;box-sizing:border-box}
h1{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:1.6rem;margin:0 0 4px;text-wrap:balance}
.sub{color:var(--muted);margin:0 0 16px;font-size:.95rem}
#stage{position:relative;width:100%;height:min(62vh,520px);min-height:300px;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#dfe6d6}
#stage canvas{display:block;width:100%;height:100%}
#msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;text-align:center;color:#22281f;font-size:.95rem}
#msg:empty{display:none}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
button{font:inherit;font-size:.92rem;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--fg);cursor:pointer}
button[aria-pressed="true"]{background:var(--accent);color:var(--on);border-color:var(--accent)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0}
.card b{display:block;font-weight:600;margin-bottom:2px}
.card span{color:var(--muted);font-size:.9rem;font-variant-numeric:tabular-nums}
</style>

<div class="wrap">
  <h1>Návrh zahrady</h1>
  <p class="sub">Náhled podle půdorysu, 16 × 12 m. Tažením otáčíte pohled, kolečkem přibližujete.</p>

  <div id="stage"><div id="msg"></div></div>

  <div class="bar" role="group" aria-label="Pohled">
    <button id="v-persp" aria-pressed="true">Perspektiva</button>
    <button id="v-top" aria-pressed="false">Pohled shora</button>
  </div>
  <div class="bar" id="layers" role="group" aria-label="Vrstvy"></div>
  <div class="grid" id="list"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
// One list drives both the toggles and the spec cards, so the two can't drift apart.
const ITEMS = [
  {key:'lawn',    name:'Trávník',        dims:'16 × 12 m'},
  {key:'path',    name:'Kamenná cesta',  dims:'1,2 m široká, 10 m dlouhá'},
  {key:'bedA',    name:'Záhon A',        dims:'3 × 3 m, výška 0,3 m'},
  {key:'bedB',    name:'Záhon B',        dims:'3 × 3 m, výška 0,3 m'},
  {key:'trees',   name:'Stromy',         dims:'2 ks, výška cca 3,5 m'},
  {key:'pond',    name:'Jezírko',        dims:'Ø 2,6 m, hloubka 0,4 m'},
  {key:'pergola', name:'Pergola',        dims:'3 × 2,5 m, výška 2,4 m'},
  {key:'fence',   name:'Plot a zeď',     dims:'obvod 56 m, plot 1,2 m, zeď 3 m'}
];
const PERSP = [13, 11, 17], TOP = [0, 24, 0.01];

const stage = document.getElementById('stage');
const msg = document.getElementById('msg');

if (typeof THREE === 'undefined' || typeof THREE.OrbitControls === 'undefined') {
  msg.textContent = 'Knihovnu Three.js se nepodařilo načíst.';
} else {
  let renderer;
  try {
    renderer = new THREE.WebGLRenderer({antialias: true});
  } catch (e) {
    msg.textContent = 'Tento prohlížeč nepodporuje WebGL, 3D náhled nelze zobrazit.';
  }

  if (renderer) {
    renderer.shadowMap.enabled = true;
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    stage.insertBefore(renderer.domElement, msg);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#dfe6d6');

    const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 200);
    camera.position.set(...PERSP);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.maxPolarAngle = Math.PI / 2 - 0.05;
    controls.update();

    scene.add(new THREE.HemisphereLight(0xffffff, 0x8a7a5a, 0.9));
    const sun = new THREE.DirectionalLight(0xfff3dc, 1.1);
    sun.position.set(-8, 16, 10);
    sun.castShadow = true;
    sun.shadow.mapSize.set(1024, 1024);
    Object.assign(sun.shadow.camera, {left: -14, right: 14, top: 14, bottom: -14});
    scene.add(sun);

    const mat = (c, o = {}) => new THREE.MeshStandardMaterial(Object.assign({color: c, roughness: 0.9}, o));
    const add = (g, m) => { m.castShadow = true; m.receiveShadow = true; g.add(m); return m; };
    const box = (g, w, h, d, c, x, y, z) => {
      const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat(c));
      m.position.set(x, y, z);
      return add(g, m);
    };

    // One group per layer, so each toggle hides its whole group.
    const G = {};
    ITEMS.forEach(i => { G[i.key] = new THREE.Group(); scene.add(G[i.key]); });

    // Lawn
    const lawn = new THREE.Mesh(new THREE.PlaneGeometry(16, 12), mat('#7fa35a'));
    lawn.rotation.x = -Math.PI / 2;
    lawn.receiveShadow = true;
    G.lawn.add(lawn);

    // Stepping-stone path from the house door (north) to the gate (south)
    for (let i = 0; i < 9; i++) box(G.path, 1.2, 0.05, 0.7, '#b9b1a0', 0, 0.03, -4.2 + i * 1.1);

    // Raised beds with simple planting
    const bed = (g, x, z) => {
      box(g, 3, 0.3, 3, '#6b4a2f', x, 0.15, z);
      for (let ix = -1; ix <= 1; ix++) for (let iz = -1; iz <= 1; iz++) {
        const s = add(g, new THREE.Mesh(new THREE.SphereGeometry(0.35, 12, 10), mat('#4f7a3a')));
        s.position.set(x + ix * 0.9, 0.5, z + iz * 0.9);
      }
    };
    bed(G.bedA, -4.5, -1);
    bed(G.bedB, 4.5, 1.5);

    // Trees
    const tree = (x, z) => {
      const t = add(G.trees, new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.2, 2.2, 8), mat('#6b4a2f')));
      t.position.set(x, 1.1, z);
      const c = add(G.trees, new THREE.Mesh(new THREE.SphereGeometry(1.3, 20, 16), mat('#56803f')));
      c.position.set(x, 3.1, z);
    };
    tree(-6, -4);
    tree(6.5, -4.5);

    // Pond with stone rim
    const water = new THREE.Mesh(new THREE.CircleGeometry(1.3, 40), mat('#4f8aa0', {roughness: 0.2, metalness: 0.1}));
    water.rotation.x = -Math.PI / 2;
    water.position.set(4, 0.02, -3);
    G.pond.add(water);
    const rim = new THREE.Mesh(new THREE.TorusGeometry(1.3, 0.08, 8, 40), mat('#9a9486'));
    rim.rotation.x = Math.PI / 2;
    rim.position.set(4, 0.05, -3);
    add(G.pond, rim);

    // Pergola centred at (-4, 4.5)
    const px = [-5.5, -2.5], pz = [3.25, 5.75];
    px.forEach(x => pz.forEach(z => box(G.pergola, 0.12, 2.4, 0.12, '#8a6a4a', x, 1.2, z)));
    pz.forEach(z => box(G.pergola, 3.2, 0.12, 0.12, '#8a6a4a', -4, 2.4, z));
    px.forEach(x => box(G.pergola, 0.12, 0.12, 2.7, '#8a6a4a', x, 2.4, 4.5));

    // Fence on three sides, house wall on the north side
    box(G.fence, 0.08, 1.2, 12, '#8a6a4a', -8, 0.6, 0);
    box(G.fence, 0.08, 1.2, 12, '#8a6a4a', 8, 0.6, 0);
    box(G.fence, 16, 1.2, 0.08, '#8a6a4a', 0, 0.6, 6);
    box(G.fence, 16, 3, 0.3, '#d9d2c3', 0, 1.5, -6);

    // Layer toggles and spec cards
    const layersEl = document.getElementById('layers');
    const listEl = document.getElementById('list');
    ITEMS.forEach(i => {
      const b = document.createElement('button');
      b.textContent = i.name;
      b.setAttribute('aria-pressed', 'true');
      b.onclick = () => {
        G[i.key].visible = !G[i.key].visible;
        b.setAttribute('aria-pressed', String(G[i.key].visible));
      };
      layersEl.appendChild(b);

      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = '<b></b><span></span>';
      card.querySelector('b').textContent = i.name;
      card.querySelector('span').textContent = i.dims;
      listEl.appendChild(card);
    });

    // Views: animate the camera to a goal, then hand control back to the user
    let goal = null;
    const pTop = document.getElementById('v-top'), pPersp = document.getElementById('v-persp');
    function setView(top) {
      goal = new THREE.Vector3(...(top ? TOP : PERSP));
      controls.maxPolarAngle = top ? Math.PI : Math.PI / 2 - 0.05;
      pTop.setAttribute('aria-pressed', String(top));
      pPersp.setAttribute('aria-pressed', String(!top));
    }
    pPersp.onclick = () => setView(false);
    pTop.onclick = () => setView(true);

    function resize() {
      const w = stage.clientWidth, h = stage.clientHeight;
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
    }
    new ResizeObserver(resize).observe(stage);
    resize();

    renderer.setAnimationLoop(() => {
      if (goal) {
        camera.position.lerp(goal, 0.08);
        if (camera.position.distanceTo(goal) < 0.02) goal = null;
      }
      controls.update();
      renderer.render(scene, camera);
    });
  }
}
</script>

</html>
